[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-horizon"
version = "0.1.0"
description = "Environmental Audio Classifier - Detecting Human Noise Intrusion in Natural Soundscapes"
readme = "README.md"
authors = [
    {name = "QuietHorizon Contributors"}
]
license = {text = "MIT"}
keywords = ["audio", "classification", "machine-learning", "conservation", "bioacoustics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0,<3.0",
    "librosa>=0.10.1",
    "tensorflow>=2.15.0,<2.21",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.31.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.1.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

all = [
    "quiet-horizon[frontend,dev]",
]

[project.urls]
Homepage = "https://github.com/yourusername/QuietHorizon"
Documentation = "https://github.com/yourusername/QuietHorizon#readme"
Repository = "https://github.com/yourusername/QuietHorizon"
"Bug Tracker" = "https://github.com/yourusername/QuietHorizon/issues"
"Model Hub" = "https://huggingface.co/bbureau12/QuietHorizon"

[project.scripts]
quiet-horizon = "quiet_horizon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quiet_horizon*"]
exclude = ["tests*", "frontend*", "docs*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_model: marks tests that require model download",
]

[tool.coverage.run]
source = ["quiet_horizon"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "cv2.*",
    "streamlit.*",
]
ignore_missing_imports = true
