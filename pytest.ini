[pytest]
# Pytest configuration for QuietHorizon

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    requires_model: marks tests that require trained model
    requires_audio: marks tests that require audio files
    network: marks tests that require network access

# Coverage options (when pytest-cov is installed)
# addopts = --cov=quiet_horizon --cov=frontend --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
