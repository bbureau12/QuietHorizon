name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Lint with ruff
      run: |
        ruff check quiet_horizon/ tests/

    - name: Check formatting with black
      run: |
        black --check quiet_horizon/ tests/

    - name: Type check with mypy
      run: |
        mypy quiet_horizon/
      continue-on-error: true  # Don't fail on type errors yet

    - name: Run tests with pytest
      run: |
        pytest tests/ --cov=quiet_horizon --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend-test:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install frontend dependencies
      run: |
        pip install -e .
        pip install -r frontend/requirements.txt

    - name: Check frontend imports
      run: |
        python -c "import frontend.app"
        python -c "from frontend.utils import load_model, process_audio_file"

    - name: Lint frontend
      run: |
        ruff check frontend/
        black --check frontend/
