[project]
name = "quiethorizon-mcp"
version = "1.0.0"
description = "Model Context Protocol server for QuietHorizon environmental audio classification"
authors = [{name = "QuietHorizon Team"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "mcp>=0.9.0",
    "tensorflow>=2.15.0,<2.16.0",
    "librosa>=0.11.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
